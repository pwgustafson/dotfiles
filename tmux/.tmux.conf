unbind-key -n C-b
set -g prefix C-s

bind-key -r C-s send-prefix

bind-key r source-file ~/.tmux.conf \; display-message "TMUX conf reloaded"

bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

bind-key x kill-pane
bind-key b break-pane -d 

set-option -g default-terminal "screen-256color"
set-option -g status-keys "emacs"

# Bind 'C-v' to split window vertically with the current directory
bind-key -n C-v split-window -v -c '#{pane_current_path}'
# Bind 'C-h' to split window horizontally with the current directory
bind-key -n C-h split-window -h -c '#{pane_current_path}'

# Resizing
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1


bind -n C-Left resize-pane -L 10
bind -n C-Right resize-pane -R 10
bind -n C-Down resize-pane -D 5
bind -n C-Up resize-pane -U 5


bind C-j split-window -v "tmux list-sessions | sed -E 's/:.*$//' | fzf --reverse | xargs tmux switch-client -t"

# SPLIT WINDOW AND PASS IN COMMAND
bind-key h split-window -h "htop"

# JOINING & SWAPPING PANES
bind-key j command-prompt -p "join pane from: " "join-pane -h -s '%%'"
bind-key s display-panes\; command-prompt -p "pane #: " "swap-pane -t '%%'"

### DESIGN CONFIG  ###
######################

# panes
set -g pane-border-fg black
set -g pane-active-border-fg brightred

## Status bar design
# Status line
# set -g utf8 on
set -g status-justify left
set -g status-bg default
set -g status-fg colour12
set -g status-interval 5

# # Messaging
set -g message-style fg=black,bg=yellow
set -g message-command-style fg=blue,bg=black

#window mode
set -g mode-style fg=default,bg=colour234

# Window status format
set -g window-status-format " #F#I:#W#F "
set -g window-status-current-format " #F#I:#W#F "

# Custom window status format with colors
set -g window-status-format "#[fg=magenta]#[bg=black] #I #[bg=cyan]#[fg=colour8] #W "
set -g window-status-current-format "#[bg=brightmagenta]#[fg=colour8] #I #[fg=colour8]#[bg=colour14] #W "

# Window status current style
set -g window-status-current-style bg=black
set -g window-status-current-style fg=colour11
set -g window-status-current-style dim

# Window status style
setw -g window-status-style bg=green,fg=black,reverse

# Info on left (I don't have a session display for now)
set -g status-left ''

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# set -g default-terminal "screen-256color"

# # The modes {
set  -g clock-mode-colour colour135
set -g mode-style bold
set -g mode-style fg=colour196,bg=colour238

# }
# The panes {

set -g pane-border-style bg=colour235
set -g pane-border-style fg=colour238
set -g pane-active-border-style bg=colour236
set -g pane-active-border-style fg=colour51


# # }
# # The statusbar {

set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-style dim
set -g status-left ''
set -g status-right '#() #[fg=colour233,bg=colour241,bold] %b %d %Y #[fg=colour233,bg=colour111,bold] %I:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

set -g window-status-current-fg colour81
set -g window-status-current-bg colour238
set -g window-status-current-attr bold
set -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

set -g window-status-fg colour138
set -g window-status-bg colour235
set -g window-status-attr none
set -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

set -g window-status-bell-attr bold
set -g window-status-bell-fg colour255
set -g window-status-bell-bg colour1

set -g window-status-style fg=white,bg=default
set -g window-status-current-style fg=green,bg=default,bold                

